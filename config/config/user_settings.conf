// NS-3 MANET 仿真用户配置
// 生成时间: 2026-05-18T01:34:27.310951

--- General [全局] ---
// [全局] 节点数量：仿真中同时活跃的节点总数（2-100）
nNodes = 5

// [全局] 仿真时长：单轮仿真的持续时间（秒）
simulationTime = 300.0

// [全局] 随机种子：控制伪随机数生成器的初始状态
seed = 1

// [全局] 运行编号：用于区分同一配置下的多次重复实验
run = 1

// [全局] 日志组件：逗号分隔的 ns-3 LogComponent 名称
logComponents = ""

--- PHY Model & Channel [全局] ---
// [全局] 802.11 标准：决定调制方式和速率表
standard = "80211n-2.4GHz"

// [全局] PHY 模型：yans（简化）或 spectrum（频谱级仿真）
phyModel = "yans"

// [全局] 中心频率：工作频段的中心频率（MHz），默认 2412 MHz（WiFi 2.4GHz Channel 1）
frequencyMhz = 2412

// [全局] 信道带宽：每个信道的带宽（MHz）
channelWidthMhz = 20

// [全局] 数据速率：固定使用的 PHY 数据速率模式
dataRate = "HtMcs7"

--- Propagation [全局] ---
// [全局] 传播延迟模型：ConstantSpeed（光速）或 Random
propagationDelay = "ConstantSpeed"

// [全局] 路径损耗模型：FreeSpace/LogDistance/TwoRayGround 等
pathLossModel = "FreeSpace"

// [全局] 路径损耗指数：LogDistance 模型中的衰减指数
pathLossExponent = 2.0

// [全局] 1m 参考损耗：参考距离 1 米处的路径损耗（dB）
pathLossRefLoss = 46.6777

// [全局] 参考距离：计算参考损耗的距离（米）
pathLossRefDistance = 1.0

// [全局] 启用衰落：是否叠加小尺度衰落模型
enableFading = false

// [全局] 衰落模型：Nakagami（默认）或 Jakes
fadingModel = "Nakagami"

// [全局] Nakagami M0：近距离（d < D1）的衰落参数
nakagamiM0 = 1.5

// [全局] Nakagami M1：中距离（D1 <= d < D2）的衰落参数
nakagamiM1 = 1.0

// [全局] Nakagami M2：远距离（d >= D2）的衰落参数
nakagamiM2 = 0.75

// [全局] Nakagami 距离 D1：M0/M1 分界的距离阈值（米）
nakagamiD1 = 50.0

// [全局] Nakagami 距离 D2：M1/M2 分界的距离阈值（米）
nakagamiD2 = 100.0

// [全局] Rician K 因子：直射路径与散射路径的功率比（dB），仅 fadingModel=Rician 时生效
ricianK = 9.0

--- Obstacles [全局] ---
// [全局] 启用障碍物：是否叠加地形/障碍物模型（阴影 + 穿透 + 绕射）
enableObstacles = false

// [全局] 阴影标准差：对数正态阴影衰落的标准差（dB）
obstacleShadowingSigma = 4.0

// [全局] 穿透损耗：NLOS 路径的额外穿透损耗（dB）
obstaclePenetrationLoss = 10.0

// [全局] 启用绕射：是否计算障碍物边缘的刀边绕射损耗
obstacleDiffractionEnabled = true

// [全局] 障碍物配置：JSON 数组描述矩形障碍物 [{x,y,w,h,loss}]
obstaclesJson = "[]"

--- Range [全局/动态可调] ---
// [全局/动态可调] 目标覆盖范围：叠加在传播模型上的硬截断距离（米），运行时可通过 /api/env/range 修改
rangeTargetM = 4000.0

--- MAC Network [全局] ---
// [全局] SSID：网络标识符
ssid = "adhoc-30ns3"

// [全局] BSSID：基本服务集标识符（MAC 格式）
bssid = "00:00:00:00:AD:H0"

// [全局] MAC 模式：当前版本强制 mesh（802.11s），adhoc 已禁用
macMode = "mesh"

// [全局] 速率控制算法：Arf/Aarf/Onoe/Constant/Minstrel
rateControl = "Constant"

--- Routing [全局] ---
// [全局] 路由协议：aodv/olsr/dsdv/dsr/none
routingProtocol = "aodv"

// [全局] AODV Hello 间隔：邻居发现广播间隔（秒）
aodvHelloInterval = 1.0

// [全局] AODV RREQ 重试：路由请求的最大重传次数
aodvRreqRetries = 2

// [全局] AODV 活跃路由超时：未使用路由的过期时间（秒）
aodvActiveRouteTimeout = 10.0

// [全局] AODV 删除周期：路由表项的清理周期（秒）
aodvDeletePeriod = 5.0

// [全局] AODV 网络直径：预估的网络最大跳数
aodvNetDiameter = 35

// [全局] AODV 启用 Hello：是否使用 Hello 消息维护邻居关系
aodvEnableHello = true

// [全局] OLSR Hello 间隔：拓扑发现广播间隔（秒）
olsrHelloInterval = 2.0

// [全局] OLSR TC 间隔：拓扑控制消息发送间隔（秒）
olsrTcInterval = 5.0

// [全局] OLSR 意愿值：节点转发 TC 消息的意愿（0-7）
olsrWillingness = 7

// [全局] DSDV 定期更新间隔：路由表广播间隔（秒）
dsdvPeriodicUpdateInterval = 15.0

// [全局] DSDV 稳定时间：等待路由收敛的最长时间（秒）
dsdvSettlingTime = 6.0

--- Mobility [全局] ---
// [全局] 移动模型：random-walk/gauss-markov/grid/constant
mobilityModel = "random-walk"

// [全局] 区域最小 X：仿真区域的左边界（米）
mobilityMinX = 0.0

// [全局] 区域最大 X：仿真区域的右边界（米）
mobilityMaxX = 5000.0

// [全局] 区域最小 Y：仿真区域的下边界（米）
mobilityMinY = 0.0

// [全局] 区域最大 Y：仿真区域的上边界（米）
mobilityMaxY = 5000.0

// [全局] 随机游走最小速度：节点最小移动速度（m/s）
rwMinSpeed = 0.5

// [全局] 随机游走最大速度：节点最大移动速度（m/s）
rwMaxSpeed = 3.0

// [全局] 随机游走距离：Distance 模式下每次改变方向前移动的距离（米）
rwDistance = 200.0

// [全局] 随机游走模式：Time（按时间）或 Distance（按距离）
rwMode = "Time"

// [全局] 随机游走时间：Time 模式下每次改变方向前的时间（秒）
rwTime = 1.0

// [全局] 网格起始 X：Grid 布局的左上角 X 坐标（米）
gridMinX = 100.0

// [全局] 网格起始 Y：Grid 布局的左上角 Y 坐标（米）
gridMinY = 100.0

// [全局] 网格 X 间距：Grid 布局中节点水平间距（米）
gridDeltaX = 800.0

// [全局] 网格 Y 间距：Grid 布局中节点垂直间距（米）
gridDeltaY = 800.0

// [全局] 网格每行节点数：Grid 布局每行的节点数量
gridWidth = 6

// [全局] 网格布局：RowFirst（按行填充）或 ColumnFirst（按列填充）
gridLayout = "RowFirst"

// [全局] 高斯-马尔可夫 Alpha：速度记忆系数（0=完全随机, 1=直线运动）
gmAlpha = 0.85

--- Tracing [全局] ---
// [全局] PCAP 跟踪：是否生成 PCAP 抓包文件
pcap = true

// [全局] ASCII 跟踪：是否生成 ASCII 文本跟踪文件
ascii = false

// [全局] 流监控：是否启用 ns-3 FlowMonitor 端到端统计
flowMonitor = true

// [全局] PCAP 文件名前缀：跟踪文件的路径前缀
pcapPrefix = "manet-30nodes-adhoc"

// [全局] 移动性跟踪：是否记录节点位置轨迹
enableMobilityTrace = false

--- PHY Device [节点] ---
// [节点] 发射功率起始：最小发射功率（dBm），支持运行时单节点调整
txPowerStart = 30.0

// [节点] 发射功率结束：最大发射功率（dBm），支持运行时单节点调整
txPowerEnd = 30.0

// [节点] 发射功率等级数：功率控制的分级数量
txPowerLevels = 1

// [节点] 接收灵敏度：可解调信号的最小接收功率（dBm），支持运行时单节点调整
rxSensitivity = -92.0

// [节点] CCA 阈值：信道评估的忙碌判定门限（dBm）
ccaThreshold = -82.0

// [节点] 天线增益：全向天线增益（dBi）
antennaGain = 3.0

--- MAC Device [预留] ---
// [预留] RTS/CTS 阈值：当前代码未接入 ns-3
rtsCtsThreshold = 2200

// [预留] 分片阈值：当前代码未接入 ns-3
fragmentationThreshold = 2200

// [预留] 非单播模式：当前代码未接入 ns-3
nonUnicastMode = false

// [预留] 信标间隔：当前代码未接入 ns-3
beaconInterval = 100

// [预留] 最小竞争窗口：当前代码未接入 ns-3
cwMin = 15

// [预留] 最大竞争窗口：当前代码未接入 ns-3
cwMax = 1023
